name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m0:
    name: M0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.102
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.24"
          enable-cache: true
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: false
      - name: Install pinned Git LFS
        # ubuntu-latest moved to Git LFS 3.8.0 in early September 2026 while the
        # doctor pins 3.7.1; the pin is load-bearing, so the gate installs the
        # exact release it declares rather than trusting the runner image.
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          version="$(grep CANNONBALL_GIT_LFS_VERSION scripts/tool-versions.sh | cut -d '"' -f 2)"
          archive="$RUNNER_TEMP/git-lfs.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${version}/git-lfs-linux-amd64-v${version}.tar.gz"
          echo "1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/git-lfs-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP" "git-lfs-${version}/git-lfs"
          mv "$RUNNER_TEMP/git-lfs-${version}/git-lfs" "$RUNNER_TEMP/git-lfs-bin/git-lfs"
          echo "$RUNNER_TEMP/git-lfs-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/git-lfs-bin/git-lfs" version
      - name: Verify complete M0 gate
        shell: bash
        run: ./scripts/check.sh
      - name: Verify integrated visual slice
        shell: bash
        run: ./scripts/verify-integrated-visual-slice.sh
      - name: Upload M0 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m0-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            reports/m0/
            .tools/scenarios/official-corridor/
          if-no-files-found: error
          retention-days: 14

  playgodot:
    name: PlayGodot semantic UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.102
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.24"
          python-version: "3.13.11"
          enable-cache: true
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: false
      - name: Verify required PlayGodot semantic UI
        shell: bash
        run: |
          godot_bin="$(command -v godot)"
          export GODOT_BIN="$godot_bin"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export PLAYGODOT_XVFB=1
          fi
          export PLAYGODOT_ARTIFACT_DIR="$PWD/reports/playgodot"
          ./scripts/verify-playgodot.sh
      - name: Upload PlayGodot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playgodot-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            reports/playgodot/
            .tools/scenarios/official-corridor/
          if-no-files-found: warn
          retention-days: 14

  long-route:
    name: Deterministic 500-mile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_ROLL_FORWARD: Major
      CANNONBALL_SCENARIO_TIMEOUT_SECONDS: 600
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.102
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.24"
          enable-cache: true
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: false
      - name: Traverse deterministic 500-mile route
        shell: bash
        env:
          CANNONBALL_GODOT_LOG_FILE: reports/m1/p0-006-godot.log
          CANNONBALL_SCENARIO_RESULT_FILE: reports/m1/p0-006-scenario.json
        run: >-
          ./scripts/run-scenario.sh
          --distance-miles 500
          --platform current
          --evidence reports/m1/p0-006-evidence.json
      - name: Upload long-route evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p0-006-long-route-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            reports/m1/
            .tools/scenarios/representative-corridor/
          if-no-files-found: error
          retention-days: 14
