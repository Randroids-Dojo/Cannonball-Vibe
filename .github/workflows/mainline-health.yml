# Mainline red/green tripwire (ADR-0025).
#
# NOTE: the `workflows:` filter below matches each watched workflow's `name:`
# field, not its filename. Renaming a watched workflow silently detaches this
# watcher — update both together.
name: Mainline health

on:
  workflow_run:
    workflows:
      - CI
      - Deterministic assets
      - Reproducible unsigned fixture exports
      - Windows packaged short-corridor soak
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluation mode; simulate modes use the red-main-test label
        type: choice
        default: evaluate
        options:
          - evaluate
          - simulate-failure
          - simulate-success

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mainline-health
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate mainline health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'evaluate' }}
      TRIGGER_EVENT: ${{ github.event_name }}
      TRIGGER_RUN_NAME: ${{ github.event.workflow_run.name }}
      TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
      TRIGGER_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Evaluate watched workflows and update the red-main issue
        run: |
          set -euo pipefail

          # Simulate modes exercise the issue lifecycle without touching the
          # real signal label.
          if [ "$MODE" = "evaluate" ]; then
            LABEL="red-main"
          else
            LABEL="red-main-test"
          fi
          TITLE="Red main: mainline workflow failure"
          gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Mainline is failing; fix-forward before new work" \
            --force

          # Full state evaluation on every trigger (race-proof): the verdict
          # comes from the latest effective completed run of every watched
          # workflow on main, not from the triggering event alone.
          WATCHED="ci.yml assets.yml unsigned-exports.yml windows-stress.yml"
          RED=0
          FAILING=""
          GREEN_DETAIL=""
          if [ "$MODE" = "simulate-failure" ]; then
            RED=1
            FAILING="- simulated failure (workflow_dispatch mode=simulate-failure)"
          elif [ "$MODE" = "simulate-success" ]; then
            RED=0
          else
            for wf in $WATCHED; do
              RUN_JSON=$(gh run list --repo "$REPO" --workflow "$wf" \
                --branch main --status completed --limit 5 \
                --json conclusion,url,headSha 2>/dev/null || echo '[]')
              # Newest run whose conclusion is meaningful.
              EFFECTIVE=$(echo "$RUN_JSON" | jq -c \
                '[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped" and .conclusion != "stale")][0] // empty')
              [ -z "$EFFECTIVE" ] && continue  # no runs yet: vacuously green
              CONCLUSION=$(echo "$EFFECTIVE" | jq -r '.conclusion')
              URL=$(echo "$EFFECTIVE" | jq -r '.url')
              SHA=$(echo "$EFFECTIVE" | jq -r '.headSha')
              case "$CONCLUSION" in
                failure|timed_out|action_required)
                  RED=1
                  FAILING="${FAILING}- \`$wf\` is $CONCLUSION at \`$SHA\`: $URL"$'\n'
                  ;;
                *)
                  GREEN_DETAIL="${GREEN_DETAIL}- \`$wf\`: $URL"$'\n'
                  ;;
              esac
            done
          fi

          OPEN_ISSUE=$(gh issue list --repo "$REPO" --label "$LABEL" \
            --state open --json number --jq '.[0].number // empty')

          if [ "$RED" = "1" ]; then
            if [ -z "$OPEN_ISSUE" ]; then
              BODY="Mainline is red. Per AGENTS.md (Mainline integration, ADR-0025), repair preempts all new task selection. Fix forward only: never revert, never force-push, never bypass-merge.

          Failing workflows:
          $FAILING
          If the failure is the daily Windows soak, re-dispatch it after the fix: \`gh workflow run windows-stress.yml\`.

          This issue is maintained by the Mainline health workflow and closes automatically when every watched workflow's latest completed run on main is green."
              gh issue create --repo "$REPO" --title "$TITLE" \
                --label "$LABEL" --body "$BODY"
            else
              # Append one comment per red completion of a watched workflow.
              if { [ "$TRIGGER_EVENT" = "workflow_run" ] && \
                   { [ "$TRIGGER_RUN_CONCLUSION" = "failure" ] || \
                     [ "$TRIGGER_RUN_CONCLUSION" = "timed_out" ]; }; } || \
                 [ "$MODE" = "simulate-failure" ]; then
                if [ "$MODE" = "simulate-failure" ]; then
                  COMMENT="Still red (simulated)."
                else
                  COMMENT="Still red: \`$TRIGGER_RUN_NAME\` concluded $TRIGGER_RUN_CONCLUSION: $TRIGGER_RUN_URL"
                fi
                gh issue comment "$OPEN_ISSUE" --repo "$REPO" --body "$COMMENT"
              fi
            fi
          else
            if [ -n "$OPEN_ISSUE" ]; then
              if [ "$MODE" = "simulate-success" ]; then
                CLOSE_BODY="Mainline is green again (simulated)."
              else
                CLOSE_BODY="Mainline is green again. Latest completed runs:
          $GREEN_DETAIL"
              fi
              gh issue close "$OPEN_ISSUE" --repo "$REPO" --comment "$CLOSE_BODY"
            fi
          fi
